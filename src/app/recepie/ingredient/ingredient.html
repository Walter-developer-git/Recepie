<!-- ingredient-form.component.html -->
<form [formGroup]="ingredientForm" (ngSubmit)="onSubmit()" class="ingredient-form" dir="rtl">
  <h2>{{ isEditMode ? 'ویرایش ماده اولیه' : 'افزودن ماده اولیه' }}</h2>

  <div class="form-group">
    <div class="label-container">
      <label for="name">نام ماده اولیه*</label>
    </div>
    <input type="text" id="name" formControlName="name" placeholder="مثال: روغن زیتون"
      [class.invalid]="name.invalid && (name.dirty || name.touched)">
    <div class="validation-error" *ngIf="name.invalid && (name.dirty || name.touched)">
      <span *ngIf="name.errors?.['required']">نام ماده اولیه الزامی است</span>
    </div>
  </div>

  <div class="form-group">
    <div>
      <div class="label-container">
        <label for="amount">مقدار*</label>
      </div>
    </div>
    <input type="text" id="amount" formControlName="amount" placeholder="مثال: ۱ فنجان، ۲۰۰ گرم"
      [class.invalid]="amount.invalid && (amount.dirty || amount.touched)">
    <div class="validation-error" *ngIf="amount.invalid && (amount.dirty || amount.touched)">
      <span *ngIf="amount.errors?.['required']">مقدار الزامی است</span>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">انصراف</button>
    <button type="submit" class="btn btn-primary" [disabled]="ingredientForm.invalid">
      {{ isEditMode ? 'بروزرسانی' : 'افزودن' }} ماده اولیه
    </button>
  </div>

  <ng-container *ngIf="items.length == 0">
    <div class="ingredient-list">
      <div class="ingredient-info">
        <span class="ingredient-title">ابتدا یک یا چند ماده اولیه اضافه کنید</span>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="items.length > 0">
    <ng-container *ngFor="let item of items; let i = index">
      <div class="ingredient-list">
        <div class="ingredient-info">
          <span class="ingredient-title">{{ item?.name }}</span>
          <span class="ingredient-quantity">{{ item?.amount }}</span>
        </div>
        <button (click)="deleteItem(i)" mat-icon-button color="warn" aria-label="حذف ماده اولیه">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </ng-container>
  </ng-container>
</form>
